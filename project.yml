# XcodeGen specification — the source of truth for Pilothouse.xcodeproj.
# Regenerate with `scripts/bootstrap.sh` (or `xcodegen generate`).
name: Pilothouse
options:
  bundleIdPrefix: com.ardasenturk
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: 5JMD3VSD7N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "5"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  PilothouseKit:
    path: PilothouseKit

targets:
  PilothouseMac:
    type: application
    platform: macOS
    sources:
      - path: PilothouseMac
      - path: Shared
      - path: PilothouseHelper/com.ardasenturk.Pilothouse.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: PilothouseKit
        product: PilothouseKit
      - package: PilothouseKit
        product: PilothouseHost
      - target: PilothouseHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: Pilothouse
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse.Mac
        INFOPLIST_FILE: PilothouseMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: PilothouseMac/Resources/PilothouseMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          OTHER_CODE_SIGN_FLAGS: --timestamp

  PilothouseHelper:
    type: tool
    platform: macOS
    sources:
      - path: PilothouseHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PilothouseHelper
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse.Helper
        INFOPLIST_FILE: PilothouseHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          OTHER_CODE_SIGN_FLAGS: --timestamp

  PilothouseiOS:
    type: application
    platform: iOS
    sources:
      - path: PilothouseiOS
    dependencies:
      - package: PilothouseKit
        product: PilothouseKit
    settings:
      base:
        PRODUCT_NAME: Pilothouse
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse
        INFOPLIST_FILE: PilothouseiOS/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  PilothouseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PilothouseUITests
    dependencies:
      - target: PilothouseiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse.UITests
        TEST_TARGET_NAME: PilothouseiOS
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  PilothouseiOS:
    build:
      targets:
        PilothouseiOS: all
        PilothouseUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - PilothouseUITests
        - package: PilothouseKit/PilothouseKitTests
    archive:
      config: Release

  PilothouseMac:
    build:
      targets:
        PilothouseMac: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: PilothouseKit/PilothouseKitTests
        - package: PilothouseKit/PilothouseHostTests
    archive:
      config: Release
