# XcodeGen specification — the source of truth for RemoteCode.xcodeproj.
# Regenerate with `scripts/bootstrap.sh` (or `xcodegen generate`).
name: RemoteCode
options:
  bundleIdPrefix: com.ardasenturk
  developmentLanguage: en
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: 5JMD3VSD7N
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "7"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

packages:
  RemoteCodeKit:
    path: RemoteCodeKit

targets:
  RemoteCodeMac:
    type: application
    platform: macOS
    sources:
      - path: RemoteCodeMac
      - path: Shared
      - path: RemoteCodeHelper/com.ardasenturk.Pilothouse.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    dependencies:
      - package: RemoteCodeKit
        product: RemoteCodeKit
      - package: RemoteCodeKit
        product: RemoteCodeHost
      - target: RemoteCodeHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_NAME: "Remote Code"
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse.Mac
        INFOPLIST_FILE: RemoteCodeMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: RemoteCodeMac/Resources/RemoteCodeMac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          OTHER_CODE_SIGN_FLAGS: --timestamp

  RemoteCodeHelper:
    type: tool
    platform: macOS
    sources:
      - path: RemoteCodeHelper
        excludes:
          - "*.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: PilothouseHelper  # launchd starts the helper by this path; keep it (D-111)
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse.Helper
        INFOPLIST_FILE: RemoteCodeHelper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
      configs:
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_STYLE: Manual
          OTHER_CODE_SIGN_FLAGS: --timestamp

  RemoteCodeiOS:
    type: application
    platform: iOS
    sources:
      - path: RemoteCodeiOS
    dependencies:
      - package: RemoteCodeKit
        product: RemoteCodeKit
    settings:
      base:
        PRODUCT_NAME: RemoteCode
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse
        INFOPLIST_FILE: RemoteCodeiOS/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  RemoteCodeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RemoteCodeUITests
    dependencies:
      - target: RemoteCodeiOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ardasenturk.Pilothouse.UITests
        TEST_TARGET_NAME: RemoteCodeiOS
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  RemoteCodeiOS:
    build:
      targets:
        RemoteCodeiOS: all
        RemoteCodeUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RemoteCodeUITests
        - package: RemoteCodeKit/RemoteCodeKitTests
    archive:
      config: Release

  RemoteCodeMac:
    build:
      targets:
        RemoteCodeMac: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: RemoteCodeKit/RemoteCodeKitTests
        - package: RemoteCodeKit/RemoteCodeHostTests
    archive:
      config: Release
