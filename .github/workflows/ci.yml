name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-linux:
    name: PilothouseKit on Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Install curl (used by FakeClaude)
        run: apt-get update -qq && apt-get install -y -qq curl python3 > /dev/null
      - name: Check translations
        run: python3 scripts/l10n/build_catalogs.py --check
      - name: Check App Store metadata
        run: python3 scripts/check-metadata.py
      - name: swift test
        working-directory: PilothouseKit
        run: swift test

  linux-image:
    name: Linux host image (Docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build linux/Dockerfile
        run: docker build -f linux/Dockerfile -t pilothouse:ci .
      - name: Smoke test
        run: |
          docker run --rm --entrypoint pilothouse-server pilothouse:ci version
          docker run --rm --entrypoint claude pilothouse:ci --version
          docker run -d --name pilothouse --network host pilothouse:ci
          for _ in $(seq 1 30); do docker exec pilothouse pilothouse-server health && break; sleep 2; done
          docker exec pilothouse pilothouse-server status
          docker exec pilothouse pilothouse-server pair --no-wait
          docker logs pilothouse

  apple:
    name: Mac + iOS (xcodebuild)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        # Foundation Models and Liquid Glass need the Xcode 26 SDK.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Mac scheme — build app and run package tests
        run: |
          xcodebuild test \
            -project Pilothouse.xcodeproj -scheme PilothouseMac \
            -destination 'platform=macOS' \
            -resultBundlePath build/mac.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: iOS scheme — build app and run UI tests on a simulator
        run: |
          SIMULATOR=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              if "iOS" in runtime:
                  for device in devices[runtime]:
                      if device["name"].startswith("iPhone"):
                          print(device["udid"]); sys.exit(0)
          sys.exit(1)')
          xcodebuild test \
            -project Pilothouse.xcodeproj -scheme PilothouseiOS \
            -destination "id=$SIMULATOR" \
            -resultBundlePath build/ios.xcresult \
            CODE_SIGNING_ALLOWED=NO
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: build/*.xcresult
          retention-days: 7
